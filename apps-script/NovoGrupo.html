<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font-family:Arial,sans-serif;font-size:13px;color:#2A241D;padding:4px 8px;}
    label{display:block;font-weight:bold;margin:14px 0 4px;}
    input[type=text], textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px;}
    textarea{height:140px;resize:vertical;}
    button{margin-top:16px;width:100%;padding:10px;background:#75003D;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
    button:disabled{opacity:.5;}
    .ajuda{font-size:11.5px;color:#704757;margin-top:2px;}
    #resultado{margin-top:16px;padding:12px;background:#F3DEE7;border-radius:8px;display:none;}
    #resultado a{word-break:break-all;}
    .erro{color:#B00020;margin-top:10px;font-size:12.5px;}
  </style>
</head>
<body>
  <label>Nome do grupo</label>
  <input type="text" id="nomeGrupo" placeholder="Ex: Família Silva">

  <label>Convidados (um nome por linha)</label>
  <textarea id="convidados" placeholder="Maria Silva&#10;João Silva&#10;..."></textarea>
  <div class="ajuda">Um nome por linha. Dá pra adicionar telefone e mover gente de grupo depois.</div>

  <button id="btnCriar" onclick="criar()">Criar grupo e gerar link</button>
  <div class="erro" id="erro"></div>

  <div id="resultado">
    <div><b>Grupo criado!</b></div>
    <div id="resTotal"></div>
    <div style="margin-top:6px;">Link do grupo:</div>
    <a id="resUrl" href="#" target="_blank"></a>
  </div>

  <script>
    function criar() {
      document.getElementById('erro').textContent = '';
      document.getElementById('resultado').style.display = 'none';
      var nome = document.getElementById('nomeGrupo').value;
      var convidados = document.getElementById('convidados').value;
      var btn = document.getElementById('btnCriar');
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false;
          document.getElementById('resTotal').textContent = r.total + ' convidado(s) cadastrado(s).';
          var a = document.getElementById('resUrl');
          a.href = r.url; a.textContent = r.url;
          document.getElementById('resultado').style.display = 'block';
          document.getElementById('nomeGrupo').value = '';
          document.getElementById('convidados').value = '';
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          document.getElementById('erro').textContent = err.message;
        })
        .criarGrupo(nome, convidados);
    }
  </script>
</body>
</html>
