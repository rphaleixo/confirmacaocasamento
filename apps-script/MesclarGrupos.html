<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font-family:Arial,sans-serif;font-size:13px;color:#2A241D;padding:4px 8px;}
    p{color:#704757;font-size:12px;}
    .linha{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F0E4E9;}
    .linha input[type=radio]{margin-left:auto;}
    .nome{font-weight:bold;}
    .status{font-size:11px;color:#8C4258;}
    button{margin-top:16px;width:100%;padding:10px;background:#75003D;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
    button:disabled{opacity:.5;}
    .legenda{display:flex;justify-content:space-between;font-size:11px;color:#999;margin-top:6px;}
    .erro{color:#B00020;margin-top:10px;font-size:12.5px;}
    .ok{color:#2E7D32;margin-top:10px;font-size:12.5px;}
  </style>
</head>
<body>
  <p>Marque os grupos que devem virar um só, e escolha à direita qual código/link vai sobreviver (útil se um convite já foi enviado com aquele link).</p>
  <div class="legenda"><span>Selecionar</span><span>Manter este link</span></div>
  <div id="lista">Carregando...</div>
  <button id="btn" onclick="mesclar()" disabled>Mesclar selecionados</button>
  <div class="erro" id="erro"></div>
  <div class="ok" id="ok"></div>

  <script>
    google.script.run.withSuccessHandler(montar).listarGrupos();

    function montar(grupos) {
      var div = document.getElementById('lista');
      if (grupos.length < 2) { div.textContent = 'Você precisa de pelo menos dois grupos cadastrados.'; return; }
      div.innerHTML = '';
      grupos.forEach(function (g) {
        var linha = document.createElement('div');
        linha.className = 'linha';

        var chk = document.createElement('input');
        chk.type = 'checkbox'; chk.className = 'chk'; chk.value = g.codigo;

        var nome = document.createElement('div');
        nome.className = 'nome'; nome.textContent = g.nome;
        var status = document.createElement('div');
        status.className = 'status'; status.textContent = g.codigo + ' — ' + g.status;
        var info = document.createElement('div');
        info.appendChild(nome); info.appendChild(status);

        var rad = document.createElement('input');
        rad.type = 'radio'; rad.name = 'manter'; rad.className = 'rad'; rad.value = g.codigo;

        linha.appendChild(chk); linha.appendChild(info); linha.appendChild(rad);
        div.appendChild(linha);
      });
      div.querySelectorAll('.chk').forEach(function (c) { c.addEventListener('change', atualizarBotao); });
      div.querySelectorAll('.rad').forEach(function (r) { r.addEventListener('change', atualizarBotao); });
    }

    function atualizarBotao() {
      var marcados = document.querySelectorAll('.chk:checked').length;
      var manter = document.querySelector('.rad:checked');
      document.getElementById('btn').disabled = !(marcados >= 2 && manter);
    }

    function mesclar() {
      var codigos = Array.from(document.querySelectorAll('.chk:checked')).map(function (c) { return c.value; });
      var manter = document.querySelector('.rad:checked').value;
      document.getElementById('erro').textContent = '';
      document.getElementById('btn').disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          document.getElementById('ok').textContent = 'Grupos mesclados! Link mantido: ' + r.mantido;
          google.script.run.withSuccessHandler(montar).listarGrupos();
        })
        .withFailureHandler(function (err) {
          document.getElementById('erro').textContent = err.message;
          document.getElementById('btn').disabled = false;
        })
        .mesclarGrupos(codigos, manter);
    }
  </script>
</body>
</html>
