<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font-family:Arial,sans-serif;font-size:13px;color:#2A241D;padding:4px 8px;}
    p{color:#704757;font-size:12px;line-height:1.5;}
    code{background:#F3DEE7;padding:1px 4px;border-radius:4px;}
    textarea{width:100%;height:220px;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12.5px;font-family:monospace;resize:vertical;}
    button{margin-top:14px;width:100%;padding:10px;background:#75003D;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
    button:disabled{opacity:.5;}
    .erro{color:#B00020;margin-top:10px;font-size:12.5px;}
    .ok{color:#2E7D32;margin-top:10px;font-size:12.5px;}
  </style>
</head>
<body>
  <p>
    Na sua planilha antiga, selecione as colunas <b>Nome</b> e <b>Grupo</b> (e <b>Telefone</b>, se tiver,
    nessa ordem), copie (Ctrl+C) e cole aqui embaixo (Ctrl+V). Grupos que ainda não existem são criados
    automaticamente, com link próprio.
  </p>
  <textarea id="colado" placeholder="Cole aqui..."></textarea>
  <button id="btn" onclick="importar()">Importar</button>
  <div class="erro" id="erro"></div>
  <div class="ok" id="ok"></div>

  <script>
    function importar() {
      var texto = document.getElementById('colado').value;
      var btn = document.getElementById('btn');
      document.getElementById('erro').textContent = '';
      document.getElementById('ok').textContent = '';
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          document.getElementById('ok').textContent =
            r.convidados + ' convidado(s) importado(s), ' + r.gruposCriados + ' grupo(s) novo(s) criado(s).';
          document.getElementById('colado').value = '';
          btn.disabled = false;
        })
        .withFailureHandler(function (err) {
          document.getElementById('erro').textContent = err.message;
          btn.disabled = false;
        })
        .importarLista(texto);
    }
  </script>
</body>
</html>
