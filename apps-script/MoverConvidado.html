<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font-family:Arial,sans-serif;font-size:13px;color:#2A241D;padding:4px 8px;}
    label{display:block;font-weight:bold;margin:14px 0 4px;}
    select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px;}
    button{margin-top:18px;width:100%;padding:10px;background:#75003D;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
    button:disabled{opacity:.5;}
    .erro{color:#B00020;margin-top:10px;font-size:12.5px;}
    .ok{color:#2E7D32;margin-top:10px;font-size:12.5px;}
  </style>
</head>
<body>
  <label>Convidado</label>
  <select id="convidado"><option>Carregando...</option></select>

  <label>Novo grupo</label>
  <select id="grupo"><option>Carregando...</option></select>

  <button id="btn" onclick="mover()">Mover convidado</button>
  <div class="erro" id="erro"></div>
  <div class="ok" id="ok"></div>

  <script>
    google.script.run.withSuccessHandler(function (convidados) {
      var sel = document.getElementById('convidado');
      sel.innerHTML = '';
      convidados.forEach(function (c) {
        var op = document.createElement('option');
        op.value = c.linha;
        op.textContent = c.nome + ' (grupo atual: ' + (c.grupoAtual || '—') + ')';
        sel.appendChild(op);
      });
    }).listarConvidadosParaMover();

    google.script.run.withSuccessHandler(function (grupos) {
      var sel = document.getElementById('grupo');
      sel.innerHTML = '';
      grupos.forEach(function (g) {
        var op = document.createElement('option');
        op.value = g.codigo;
        op.textContent = g.nome + ' (' + g.codigo + ')';
        sel.appendChild(op);
      });
    }).listarGrupos();

    function mover() {
      var linha = document.getElementById('convidado').value;
      var grupo = document.getElementById('grupo').value;
      var btn = document.getElementById('btn');
      document.getElementById('erro').textContent = '';
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function () {
          document.getElementById('ok').textContent = 'Convidado movido!';
          btn.disabled = false;
        })
        .withFailureHandler(function (err) {
          document.getElementById('erro').textContent = err.message;
          btn.disabled = false;
        })
        .moverConvidado(Number(linha), grupo);
    }
  </script>
</body>
</html>
